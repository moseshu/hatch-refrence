#
# hatch 配置示例。`hatch init` 会把它复制到 $HATCH_HOME/config.toml（默认 ~/.hatch/config.toml）。
# 本文件里永远只写“环境变量名”，不写任何密钥本身。

[user]
name = "Moses"
email = "you@126.com"
timezone = "Asia/Shanghai"

# ---------------------------------------------------------------- 模型
# provider（接口协议）：
#   "openai_compatible" / "openai_chat" — Chat Completions（DeepSeek / 通义千问兼容模式 / Moonshot / 智谱 / vLLM / Ollama 等）
#   "openai_responses"                   — Responses（{base_url}/responses）
#   "anthropic"                          — Messages（{base_url}/v1/messages）
#   "gemini"                             — generateContent（base_url 留空则用官方地址）
[[models]]
name = "main"
provider = "openai_compatible"
base_url = "https://api.deepseek.com/v1"
model = "deepseek-chat"
api_key_env = "DEEPSEEK_API_KEY"

# 也可以配置第二个模型作为降级备用，或专门用于压缩等廉价任务：
# [[models]]
# name = "cheap"
# provider = "openai_compatible"
# base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
# model = "qwen-turbo"
# api_key_env = "DASHSCOPE_API_KEY"

# Responses 协议示例：
# [[models]]
# name = "resp"
# provider = "openai_responses"
# base_url = "https://api.openai.com/v1"
# model = "your-model"
# api_key_env = "OPENAI_API_KEY"

# Gemini 示例：
# [[models]]
# name = "gemini"
# provider = "gemini"
# base_url = ""
# model = "gemini-2.5-flash"
# api_key_env = "GEMINI_API_KEY"

# 按任务路由（列表顺序即降级顺序）。留空则使用全部模型的配置顺序。
[routing]
main = ["main"]
triage = ["main"]
draft = ["main"]
compaction = ["main"]
# memory_flush = ["main"]   # 记忆整理（后台）
# brief = ["main"]          # 每日简报（后台）
# feed = ["main"]           # 每日动态（后台）

# 提示缓存 TTL（秒），按 workload。只对 Anthropic 生效（仅接受 300 或
# 3600，分别对应 5 分钟 / 1 小时 ephemeral 缓存）；OpenAI 系自动缓存、
# 不接受 TTL 参数，Gemini 的显式缓存未实现——这两家会忽略本配置，但
# 它们上报的 cached_tokens 仍会出现在 `hatch doctor` 的缓存统计里。
# [routing.cache_ttl_secs]
# brief = 300
# feed = 300

# 降级阶梯（默认已够用：refused_params → 下一个模型；timeout / server_error
# → 同模型重试一次再下一个；empty_answer → 直接停止并报 BackendError；
# 默认不跨 provider 切换）。只在想改默认行为时写，例如：
# [[routing.fallback]]
# workload = "main"
# trigger = "server_error"   # refused_params / timeout / server_error / empty_answer
# action = "stop"            # retry_same / next_model / stop

# 费用护栏
[limits]
max_calls_per_run = 100   # 单次命令最多调用模型多少次（含失败重试）
max_tokens = 4000         # 每次调用的输出上限（推理模型的思考 token 也算在内，不要设太小）
# reasoning_effort = "low"  # 推理模型可选 low / medium / high；也可用环境变量 HATCH_LLM_REASONING_EFFORT
stream = false            # hatch chat / ask 是否默认流式输出（也可用 --stream）

[agent]
max_steps = 24            # 每轮对话最多的“模型 ↔ 工具”往返次数
subagents = true          # 允许把独立任务委派给子代理（delegate / delegate_parallel）
max_depth = 2             # 嵌套深度上限：主代理 0，子代理 1，子代理的子代理 2
max_parallel = 3          # delegate_parallel 同时运行的子代理数
plan_mode = false         # 计划模式：先制定结构化计划、等批准后再执行（也可用 `hatch chat --plan`）
# 自定义子代理类型：在工作区放 agents/<name>.md（frontmatter: name/description/tools/max_steps/workload）

# ---------------------------------------------------------------- 技能
# 每轮对话开始时加载的技能（技能文件在 $HATCH_HOME/skills/<名称>/SKILL.md，
# 或 ./skills/）。技能只是工作方式说明：不授予新工具（它的 tools 列表会
# 过滤本轮可用工具），绝不能绕过审批。也可以用 `hatch skills load <名称>` 激活。
[skills]
load = []
# load = ["example-brief"]

# ---------------------------------------------------------------- MCP 服务器
# 每个 stdio 服务器一个子进程；只在对话需要时连接（enabled = false 的不连）。
# env 里只写环境变量名；token_ref 是 vault 里的 token 名字（`hatch vault set` 存入），
# 绝不是 token 本身。服务器返回的内容一律视为不可信，调用走审批队列。
# HTTP 传输：transport = "http"，url 是 POST JSON-RPC 的端点（接受普通 JSON 回复或
# SSE 流）；headers 里只写环境变量名，值从环境解析后作为请求头发送；token_ref
# 有值时作为 Authorization: Bearer 发送。`hatch mcp serve` 把本机工具以 MCP
# 服务端形式暴露出去：默认 stdio（`hatch mcp serve` / `--stdio`，协议
# 2024-11-05）；`hatch mcp serve --transport http --bind 127.0.0.1:8080` 走
# streamable HTTP（协议 2025-03-26）。HTTP 默认只绑回环地址；绑定非回环地址
# 时必须配 bearer token：vault 里的 `mcp-http`（`hatch vault set mcp-http`
# 存入，优先）或 `HATCH_MCP_TOKEN` 环境变量，否则拒绝启动。
# [[mcp_servers]]
# name = "files"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/srv/data"]
# env = []
# token_ref = "files-token"
# timeout_secs = 30
# enabled = false
# [[mcp_servers]]
# name = "remote"
# transport = "http"
# url = "http://127.0.0.1:8080/mcp"
# headers = ["X_REMOTE_KEY"]
# token_ref = "remote-token"
# timeout_secs = 30
# enabled = false

# ---------------------------------------------------------------- 连接器
# 连接器是子进程 CLI，清单放在 $HATCH_HOME/connectors/<名字>.toml（或
# $HATCH_CONNECTORS_DIR）。清单里写 command / args / env（变量名）/
# token_ref（vault 里的 token 名字）/ timeout_secs / ops 表（名字、说明、
# read_only、参数 schema）/ connect_guidance。参考连接器只有两个：
# 本地文件笔记（hatch-notes-connector，环境变量 HATCH_NOTES_DIR）与
# 本地 mock HTTP（hatch-mockhttp-connector，HATCH_MOCKHTTP_BASE_URL，
# 只连测试时启动的本地 mock 服务器）。示例清单：
# name = "notes"
# command = "hatch-notes-connector"
# timeout_secs = 10
# connect_guidance = "Set HATCH_NOTES_DIR to a notes directory."
# [[ops]]
# name = "list_notes"
# description = "List note names."
# read_only = true
# [[ops]]
# name = "write_note"
# description = "Write a note."
# read_only = false

# ---------------------------------------------------------------- 浏览器
# 开启后对话中可用 browser_* 工具（需要本机安装 Chromium / Chrome）。
# 提交表单类点击一律进审批；支付只建议不执行；遇到登录或验证码会暂停并请你用 `hatch browser takeover` 接管。
[browser]
enabled = false
chromium_path = ""        # 留空 = 自动查找（或环境变量 HATCH_CHROMIUM）
headless = true
max_tabs = 4              # 每个 profile（main / scheduler / research）同时打开的会话数
idle_timeout_secs = 600   # 空闲超过这么久的会话自动关闭
blocklist = []            # 永不访问的主机，例如 ["example.com", "*.ads.example"]
ca_bundle = ""            # 额外 CA（PEM），导入每个 profile 的证书库；留空 = HATCH_CA_BUNDLE / SSL_CERT_FILE

# ---------------------------------------------------------------- 产品 API
# `hatch daemon run --api` 同时提供产品 API（桌面端与网页端共用的后端）。
# token 不写这里：`hatch vault set daemon-api` 存入 vault（首选），或设置环境变量
# HATCH_DAEMON_API_TOKEN。未配置 token 时只允许回环绑定；非回环绑定无 token 会拒绝启动。
# 服务本身不做 TLS，对外暴露请走反向代理；限流每 IP 20 请求/秒。
[daemon]
http_enabled = false        # true = `hatch daemon run` 不加 --api 也提供 API
http_bind = "127.0.0.1:8787" # 监听地址；--api-bind 可覆盖

# ---------------------------------------------------------------- 推理代理
# 默认关闭。proxy_url 一填，全部模型请求都改走本地代理（记账、重试、限流），
# 代理再转发给 upstream_base_url；proxy_url 不带 /v1（客户端自己追加 /responses）。
# 代理的上游密钥走环境变量（api_key_env，默认 HATCH_LLM_API_KEY），只存在代理进程内存里。
# 单价不填时不估算费用；缓存 token 按输入价计，未计折扣。
[inference]
proxy_url = ""              # 如 "http://127.0.0.1:8199"；空 = 直连 provider
upstream_base_url = "https://api.deepseek.com/v1"
api_key_env = "HATCH_LLM_API_KEY"
bind = "127.0.0.1:8199"     # 只允许回环地址
max_retries = 3             # 429 / 5xx / 传输失败的重试次数
rate_limit_per_min = 60     # 每分钟请求上限；0 = 不限
# price_input_per_million = 10.0
# price_output_per_million = 40.0
# price_currency = "CNY"

# ---------------------------------------------------------------- 定时任务
# `hatch daemon run` 常驻运行；任务用 `hatch jobs add/list/enable` 管理。
# 定时任务的对外动作一律进审批队列（除非任务的 scope 显式包含该动作类别且有常设授权）。
[scheduler]
tick_secs = 60            # 检查一次到期任务的间隔（秒）
grace_minutes = 10        # 晚于计划时间不超过这么多分钟仍算准时；更晚的算"错过"
max_calls_per_job = 60    # 每次任务运行最多调用模型的次数（每次运行单独计算）

# ---------------------------------------------------------------- 邮件
# 126/163 邮箱：网页版 设置 → POP3/SMTP/IMAP → 开启 IMAP/SMTP 服务，生成“授权码”，
# 然后 export HATCH_MAIL_PASSWORD=<授权码>。授权码不是登录密码。
[mail]
source = "imap"            # imap | fixture
imap_host = "imap.126.com"
imap_port = 993
smtp_host = "smtp.126.com"
smtp_port = 465
username = "you@126.com"
password_env = "HATCH_MAIL_PASSWORD"
mailbox = "INBOX"
sender = "outbox"          # outbox（默认，只把邮件写成 .eml 文件，不真正发送）| smtp（真实发送，仍需逐封审批或常设授权）
outbox_dir = "outbox"
fixture_path = ""
fetch_limit = 50

# ---------------------------------------------------------------- 打扰预算
[attention]
quiet_start = 22
quiet_end = 8
daily_budget = 5

# ---------------------------------------------------------------- 自主度（可选）
# 取值 suggest | draft | act_notify | silent。不可逆动作（发送、删除）最高只能到 draft，支付只能 suggest。
[policy]
write_calendar = "draft"

# ---------------------------------------------------------------- 多通道传输
# 只有 pipe 参考传输：本地文件模拟一个聊天应用（收件箱 JSON → agent 回合 →
# 发件箱 JSON）。微信/飞书/Telegram 是已知但本阶段未实现的真实通道
# （OUT OF SCOPE），见 `hatch transport list`。每聊天的分享规则在
# $HATCH_HOME/chats/<chat-id>/DISCRETION.md（`hatch transport discretion`）。
[transports]
# pipe_inbox_dir = ""   # 默认 $HATCH_HOME/transports/pipe/inbox
# pipe_outbox_dir = ""  # 默认 $HATCH_HOME/transports/pipe/outbox

# ---------------------------------------------------------------- CalDAV 双向同步
# 服务器 URL + 用户名是明文配置；凭据只存 vault 里的 token 名字
# （`hatch vault set caldav`），绝不在配置文件里写 token 值。
# 同步规则：冲突时服务器版本获胜，本地版本记在冲突记录里，需
# `hatch calendar resolve <uid> --keep local` 明确批准才会推送。
# allow_http 只用于本地 mock 服务器（127.0.0.1/localhost），真实
# 服务器必须用 https://。
# [caldav]
# server_url = "https://caldav.example.com/"
# username = "you@example.com"
# token_ref = "caldav"
# calendar_url = ""   # 空 = PROPFIND 自动发现日历集合
# allow_http = false

# ---------------------------------------------------------------- 每日动态（feed）
# 一个提示词驱动整个 feed；留空用内置默认提示词。动态每天由 daily-feed
# 任务生成一次，每条都标明来源事实（`hatch feed list` 查看）。
# [feed]
# prompt = "把以下事实整理成 3–5 条值得一读的动态……"
