# CI for hatch-refrence: tests + clippy + pipeline eval smoke.
#
# Notes:
# - `cargo fmt --check` is intentionally NOT a step: the repo is not
#   fmt-clean at HEAD (pre-existing, repo-wide), so it would fail every run.
# - `cargo clippy` runs without `-D warnings`: 4 pre-existing doc-list
#   warnings exist in `crates/hatch-cli/src/commands/mcp.rs`; they are
#   reported but do not fail the job. New warnings should still be fixed.
# - `hatch-sandbox`'s `seccomp_and_capabilities` test needs unprivileged
#   user namespaces; it fails on some root/VM environments with
#   UNSHARE-DENIED. GitHub-hosted ubuntu runners allow it.
# - Live evals are NOT run here: they need a live-model API key and a
#   network path without the egress-proxy/rustls issue; see
#   docs/EVALUATION.md section 7 and scripts/run_live_eval.py.
# - `browser-basic` eval runs here with a real Chromium (installed by
#   `browser-actions/setup-chrome`, wired in via `HATCH_CHROMIUM`);
#   it needs `HATCH_BROWSER_NO_SANDBOX=1` on the GitHub runner, same
#   as the unit tests that touch the browser launcher.
name: CI

on:
  push:
    branches: [main, skills-mcp]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test + clippy + eval smoke
    runs-on: ubuntu-latest
    env:
      # GitHub-hosted runners cannot start Chromium's zygote/sandbox even
      # as a non-root user; the launcher adds --no-sandbox only with this
      # flag. Do not set it for production browsing.
      HATCH_BROWSER_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Clippy (warnings allowed, see header)
        run: cargo clippy --workspace --all-targets

      - name: Tests
        run: cargo test --workspace --no-fail-fast

      - name: Pipeline eval smoke (oracle mode, no model)
        run: |
          cargo run --quiet -p hatch-cli -- eval --world eval/worlds/zh-office
          cargo run --quiet -p hatch-cli -- eval --world eval/worlds/en-office
          cargo run --quiet -p hatch-cli -- eval --world eval/worlds/thread-attachment

      - name: Install Chromium (for the browser eval)
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Browser eval (real Chromium)
        env:
          HATCH_CHROMIUM: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: cargo run --quiet -p hatch-cli -- eval --world eval/worlds/browser-basic
