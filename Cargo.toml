[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Moses <moseshu25@gmail.com>"]
license = "MIT"
repository = "https://github.com/moseshu/hatch-refrence"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
libc = "0.2"
ureq = { version = "2", features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
rustls-pki-types = { version = "1", features = ["std"] }
mail-parser = { version = "0.9", features = ["full_encoding"] }
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
tempfile = "3"
parking_lot = "0.12"
ctrlc = "3"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

hatch-core = { path = "crates/hatch-core" }
hatch-store = { path = "crates/hatch-store" }
hatch-llm = { path = "crates/hatch-llm" }
hatch-memory = { path = "crates/hatch-memory" }
hatch-policy = { path = "crates/hatch-policy" }
hatch-connectors = { path = "crates/hatch-connectors" }
hatch-tools = { path = "crates/hatch-tools" }
hatch-agent = { path = "crates/hatch-agent" }
hatch-triage = { path = "crates/hatch-triage" }
hatch-eval = { path = "crates/hatch-eval" }
hatch-sandbox = { path = "crates/hatch-sandbox" }
hatch-scheduler = { path = "crates/hatch-scheduler" }
hatch-workers = { path = "crates/hatch-workers" }
hatch-browser = { path = "crates/hatch-browser" }
hatch-skills = { path = "crates/hatch-skills" }
hatch-mcp = { path = "crates/hatch-mcp" }
hatch-vault = { path = "crates/hatch-vault" }
hatch-plan = { path = "crates/hatch-plan" }
hatch-artifacts = { path = "crates/hatch-artifacts" }
hatch-inference = { path = "crates/hatch-inference" }
hatch-transports = { path = "crates/hatch-transports" }
hatch-goals = { path = "crates/hatch-goals" }

[profile.release]
lto = "thin"
