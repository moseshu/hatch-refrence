[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Moses (https://github.com/moseshu)"]
license = "MIT"
repository = "https://github.com/moseshu/hatch-refrence"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ureq = { version = "2", features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
mail-parser = { version = "0.9", features = ["full_encoding"] }
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
tempfile = "3"

hatch-core = { path = "crates/hatch-core" }
hatch-store = { path = "crates/hatch-store" }
hatch-llm = { path = "crates/hatch-llm" }
hatch-memory = { path = "crates/hatch-memory" }
hatch-policy = { path = "crates/hatch-policy" }
hatch-connectors = { path = "crates/hatch-connectors" }
hatch-tools = { path = "crates/hatch-tools" }
hatch-agent = { path = "crates/hatch-agent" }
hatch-triage = { path = "crates/hatch-triage" }
hatch-eval = { path = "crates/hatch-eval" }

[profile.release]
lto = "thin"
